services:
  blog-database:
    image: mongo
    ports:
      - '27017:27017'

  blog-backend:
    build: backend
    environment:
      - PORT=3001
      - DATABASE_URL=mongodb://blog-database:27017/recipe-sharing-app
    ports:
      - '3001:3001'
    depends_on:
      - blog-database

  blog-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: https://fantastic-dollop-5gp69x67qx4gc9r5-3001.app.github.dev/api/v1
    ports:
      - '3000:80'
    depends_on:
      - blog-backend
